<div class="flex h-screen w-screen overflow-hidden bg-slate-900 text-slate-100 font-sans">
  <!-- Desktop Sidebar -->
  <div class="hidden md:flex shrink-0">
    <app-customer-sidebar></app-customer-sidebar>
  </div>

  <!-- Mobile Sidebar Drawer with Backdrop -->
  @if (isMobileSidebarOpen()) {
    <div class="fixed inset-0 z-50 flex md:hidden animate-fadeIn">
      <!-- Backdrop -->
      <div
        class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm"
        (click)="isMobileSidebarOpen.set(false)"
      ></div>

      <!-- Drawer Content -->
      <div class="relative flex-1 flex flex-col max-w-xs w-full bg-slate-800 shadow-2xl z-10">
        <app-customer-sidebar (navigate)="isMobileSidebarOpen.set(false)"></app-customer-sidebar>
      </div>
    </div>
  }

  <!-- Main Content Body -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden min-w-0">
    <!-- Top Header -->
    <header class="h-16 border-b border-slate-700/60 bg-slate-800/60 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <!-- Mobile menu hamburger toggle -->
        <button
          type="button"
          (click)="isMobileSidebarOpen.set(!isMobileSidebarOpen())"
          class="md:hidden p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-700/60 transition-colors"
          aria-label="Toggle navigation menu"
        >
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <div class="flex items-center gap-2 text-sm text-slate-400">
          <span class="text-slate-200 font-medium">Customer</span>
          <span>/</span>
          <span class="text-emerald-400 font-medium">Portal</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
          Ready to Rent
        </span>
      </div>
    </header>

    <!-- Dynamic Routed Content -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-900">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
