<aside class="w-64 bg-slate-800/95 border-r border-slate-700/60 flex flex-col h-screen shrink-0 text-slate-300">
  <!-- Brand Header -->
  <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-700/60">
    <div class="h-9 w-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold shadow-md shadow-emerald-600/30">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>
    <div>
      <h1 class="text-sm font-bold text-white tracking-wide">DriveEase</h1>
      <span class="text-[10px] uppercase font-semibold text-emerald-400 tracking-wider">Customer Portal</span>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
    <div class="px-3 pb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400">
      Customer Menu
    </div>

    <!-- Vehicles Link -->
    <a
      routerLink="/customer/vehicles"
      (click)="navigate.emit()"
      routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-600/30 font-semibold"
      class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-700/60 hover:text-white transition-all duration-150 group"
    >
      <svg class="h-5 w-5 shrink-0 text-slate-400 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h8m-8 4h8m-4 4h4m6 2a2 2 0 01-2 2H4a2 2 0 01-2-2V9a2 2 0 012-2h1m2-3h10a2 2 0 012 2v1m0 0a2 2 0 012 2v8z" />
      </svg>
      <span>Explore Vehicles</span>
    </a>

    <!-- Rentals Link -->
    <a
      routerLink="/customer/rentals"
      (click)="navigate.emit()"
      routerLinkActive="bg-emerald-600 text-white shadow-lg shadow-emerald-600/30 font-semibold"
      class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-700/60 hover:text-white transition-all duration-150 group"
    >
      <svg class="h-5 w-5 shrink-0 text-slate-400 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      <span>My Rentals</span>
    </a>
  </nav>

  <!-- User & Logout Footer -->
  <div class="p-4 border-t border-slate-700/60">
    <div class="flex items-center justify-between gap-3 p-2 rounded-xl bg-slate-900/50 border border-slate-700/40">
      <div class="flex items-center gap-2.5 overflow-hidden">
        <div class="h-8 w-8 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center font-bold text-xs shrink-0">
          C
        </div>
        <div class="overflow-hidden">
          <p class="text-xs font-semibold text-white truncate">Customer</p>
          <p class="text-[10px] text-slate-400 truncate">{{ getUserEmail() }}</p>
        </div>
      </div>
      <button
        type="button"
        (click)="onLogout()"
        title="Sign out"
        class="h-8 w-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition-colors"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </button>
    </div>
  </div>
</aside>
